<!DOCTYPE html>
<html>
    <head>
        <title>Colspan dan Rowspan</title>
        <link rel="stylesheet" href="tabel_gabung.css">
    </head>
    <body>
        <h2>Colspan dan Rowspan pada Table</h2>
        <!-- colspan : menggabungkan kolom -->
        <!-- rowspan : menggabungkan baris -->
        <table class="grade-table">
            <tr>
                <th rowspan="2">No</th>
                <th rowspan="2">Nama</th>
                <th colspan="2">Nilai</th>
            </tr>
            <tr>
                <td>Ulangan 1</td>
                <td>Ulangan 2</td>
            </tr>
            <tr>
                <td>1</td>
                <td>Abelle</td>
                <td>100</td>
                <td>90</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Gus Bayem</td>
                <td>67</td>
                <td>67</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Kim Ryul</td>
                <td>41</td>
                <td>45</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Louis</td>
                <td>100</td>
                <td>100</td>
            </tr>
            <tr>
                <td>5</td>
                <td>Ohyul</td>
                <td>88</td>
                <td>79</td>
            </tr>
        </table>
    </body>
</html>
